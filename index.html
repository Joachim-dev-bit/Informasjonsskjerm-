<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#061638">
<title>Velkommen til Rush</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color:#fff;
    background:
      radial-gradient(ellipse at 8% 13%, rgba(73,255,0,.92) 0, rgba(0,220,80,.42) 19%, transparent 43%),
      radial-gradient(ellipse at 92% 55%, rgba(0,105,255,.95) 0, rgba(0,68,210,.48) 31%, transparent 62%),
      radial-gradient(ellipse at 20% 94%, rgba(0,76,255,.92) 0, transparent 45%),
      linear-gradient(145deg,#03142e 0%,#061b4b 48%,#020b25 100%);
    position:relative;
  }
  body:before, body:after {
    content:""; position:absolute; inset:-15%;
    pointer-events:none;
  }
  body:before {
    background:
      radial-gradient(ellipse at 12% 28%, transparent 0 36%, rgba(0,215,255,.23) 36.3%, transparent 37.2%),
      radial-gradient(ellipse at 84% 78%, transparent 0 42%, rgba(0,120,255,.28) 42.3%, transparent 43.1%),
      radial-gradient(ellipse at 35% 105%, transparent 0 40%, rgba(0,255,90,.18) 40.3%, transparent 41%);
    filter: blur(2px);
  }
  body:after {
    background: linear-gradient(125deg, transparent 0 48%, rgba(255,0,45,.11) 49%, transparent 50% 100%);
    opacity:.8;
  }
  .screen {
    position:relative; z-index:1; width:100%; height:100%;
    min-height:100dvh; padding:4.5vh 5vw 4vh;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center;
  }
  .brand { width:min(56vw, 360px); max-height:13vh; object-fit:contain; filter: drop-shadow(0 5px 12px rgba(0,0,0,.35)); }
  .heading { margin-top:1vh; }
  h1 { margin:0; font-size:clamp(34px,6.2vw,78px); line-height:.98; font-weight:1000; letter-spacing:-.035em; text-transform:uppercase; text-shadow:0 4px 0 rgba(0,0,0,.22), 0 8px 20px rgba(0,0,0,.3); }
  h1 span { display:block; color:#a8ff00; margin-top:.12em; }
  .rule { width:72%; height:7px; border-radius:20px; margin:2.4vh auto 0; background:linear-gradient(90deg,#a8ff00,#00e7ff,#ed123b); box-shadow:0 0 15px rgba(0,220,255,.75); }
  .cards { width:100%; flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:3vh; padding:3.5vh 0; }
  .card {
    flex:1; min-height:0; max-height:33%;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:2.2vh 4vw;
    border:3px solid rgba(0,220,255,.95); border-radius:28px;
    background:linear-gradient(145deg,rgba(2,20,58,.93),rgba(3,10,39,.88));
    box-shadow:0 0 10px rgba(0,220,255,.8), inset 0 0 22px rgba(0,110,255,.18), 0 12px 28px rgba(0,0,0,.24);
  }
  .icon { width:clamp(58px,11vh,112px); height:clamp(58px,11vh,112px); margin-bottom:1.2vh; color:#a8ff00; }
  .card h2 { margin:0; font-size:clamp(27px,5.1vw,62px); line-height:1.02; font-weight:1000; text-transform:uppercase; letter-spacing:-.025em; text-shadow:0 3px 12px rgba(0,0,0,.45); }
  .card h2 span { display:block; color:#a8ff00; margin-top:.13em; }
  .footer { width:100%; padding:1.8vh 2vw; font-size:clamp(22px,4vw,48px); line-height:1.05; font-weight:900; text-transform:uppercase; text-shadow:0 3px 12px rgba(0,0,0,.45); }
  .footer strong { color:#a8ff00; }
  .redline { height:5px; width:65%; margin:1.4vh auto 0; border-radius:8px; background:#ed123b; box-shadow:0 0 12px rgba(237,18,59,.65); }
  @media (orientation:landscape) {
    .screen { padding:3vh 4vw; }
    .brand { width:min(25vw,250px); max-height:10vh; }
    h1 { font-size:clamp(30px,5vw,64px); }
    .cards { flex-direction:row; gap:2vw; padding:2.5vh 0; }
    .card { max-height:none; padding:2vh 1.5vw; }
    .card h2 { font-size:clamp(20px,2.8vw,42px); }
    .icon { width:clamp(44px,9vh,82px); height:clamp(44px,9vh,82px); }
    .footer { font-size:clamp(20px,3vw,38px); }
  }
  @media (max-height:650px) {
    .screen { padding-top:2vh; padding-bottom:2vh; }
    .cards { gap:1.5vh; padding:1.5vh 0; }
    .icon { margin-bottom:.5vh; }
  }
</style>
</head>
